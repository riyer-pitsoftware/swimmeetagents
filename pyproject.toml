[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swim-tracker"
version = "0.1.0"
description = "Personal Ontario swim meet tracker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2.0",
  "pip-audit>=2.8,<3.0",
  "ruff>=0.11,<1.0",
]

[tool.setuptools]
packages = ["tracker", "tracker.adapters"]

[tool.setuptools.package-data]
tracker = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
