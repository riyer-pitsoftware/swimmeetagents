name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests
        run: python -m pytest -q

      - name: Compile and import smoke checks
        run: |
          python -m compileall -q tracker tests
          python -c "import tracker.sources, tracker.adapters.swim_ontario, tracker.adapters.generic_pdf"

      - name: Lint (ruff)
        run: |
          ruff check tracker tests
          ruff format --check tracker tests

      - name: Security scan (bandit)
        run: bandit -q -r tracker

      - name: Dependency audit
        run: pip-audit -r requirements-audit.txt

      - name: Validate docker compose
        run: docker compose config
