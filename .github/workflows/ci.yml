name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Compile and import smoke checks
        run: |
          uv run python -m compileall -q tracker tests
          uv run python -c "import tracker.sources, tracker.adapters.swim_ontario, tracker.adapters.generic_pdf"

      - name: Lint (ruff)
        run: |
          uv run ruff check tracker tests
          uv run ruff format --check tracker tests

      - name: Security scan (bandit)
        run: uv run bandit -q -r tracker

      - name: Dependency audit
        run: uv run pip-audit

      - name: Validate docker compose
        run: docker compose config
